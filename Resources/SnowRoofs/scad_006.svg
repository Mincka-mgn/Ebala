<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="78mm" height="30mm" viewBox="0 0 78 30">
  <title>Коническая кровля резервуара. Размеры D, H, h и угол α</title>
  <desc>Векторная схема осевого сечения резервуара с конической кровлей для вставки в Word. Высота 30 мм, размер надписей 10 пт.</desc>

  <g fill="none" stroke="#111" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Контур кровли и стен -->
    <path d="M 5.6,12.0 L 31.8,5.6 L 60,12.0 V 21.9 H 5.6 Z" stroke-width="0.37" fill="#fff"/>
    <!-- Заштрихованный серым клин ската у левого карниза -->
    <path d="M 5.6,12.0 L 19.4,8.63 V 12.0 Z" fill="#c8c8c8" stroke="none"/>
    <!-- Горизонтальный луч для угла α -->
    <path d="M 5.6,12 H 26.4" stroke-width="0.23"/>
    <!-- Размерная дуга α, центр совпадает с вершиной угла (5.6,12) -->
    <path d="M 21.64,8.08 A 16.5,16.5 0 0 1 22.1,12" stroke-width="0.23"/>

    <!-- h: вертикальный перепад от конька до уровня карниза -->
    <path d="M 31.8,5.6 H 69.2" stroke-width="0.18"/>
    <path d="M 60,12 H 65.1" stroke-width="0.18"/>
    <path d="M 63.0,5.6 V 12" stroke-width="0.24"/>

    <!-- H: полная высота от основания до уровня конька -->
    <path d="M 60,21.9 H 69.2" stroke-width="0.18"/>
    <path d="M 68.5,5.6 V 21.9" stroke-width="0.24"/>

    <!-- D: диаметр резервуара, размерная линия ниже рисунка -->
    <path d="M 5.6,22.4 V 29 M 60,22.4 V 29" stroke-width="0.18"/>
    <path d="M 5.6,27.7 H 60" stroke-width="0.24"/>
  </g>

  <g fill="#111">
    <!-- Увеличенные стрелки h -->
    <path d="M 63,5.6 L 62.45,7.75 H 63.55 Z"/>
    <path d="M 63,12 L 62.45,9.85 H 63.55 Z"/>
    <!-- Увеличенные стрелки H -->
    <path d="M 68.5,5.6 L 67.95,7.75 H 69.05 Z"/>
    <path d="M 68.5,21.9 L 67.95,19.75 H 69.05 Z"/>
    <!-- Увеличенные стрелки D -->
    <path d="M 5.6,27.7 L 7.75,27.14 V 28.26 Z"/>
    <path d="M 60,27.7 L 57.85,27.14 V 28.26 Z"/>
    <!-- Угловые стрелки: одна у ската, другая у горизонтального луча -->
    <path d="M 21.64,8.08 L 20.70,6.31 L 21.80,6.17 Z"/>
    <path d="M 22.1,12 L 22.65,13.95 H 21.55 Z"/>
  </g>

  <!-- Надписи: ровно 10 pt при размещении SVG в Word без изменения масштаба -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="3.5278" font-weight="normal" fill="#111">
    <text x="64.65" y="10.05">h</text>
    <text x="70.8" y="14.65">H</text>
    <text x="32.8" y="26.05" text-anchor="middle">D</text>
    <text x="24.8" y="17.2">α</text>
  </g>
</svg>
