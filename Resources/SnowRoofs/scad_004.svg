<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="78mm" height="30mm" viewBox="0 0 78 30">
  <title>Двускатная кровля с фонарём. Размеры L, H, h, a, h_f и угол α</title>
  <desc>Инженерная схема здания с двускатной кровлей и надстройкой-фонарём. Ширина фонаря a показана сверху. Пунктиром показано продолжение основного ската под фонарём. Высота 30 мм, надписи 10 пт.</desc>
  <g fill="none" stroke="#111" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Основной контур здания с приподнятым двускатным фонарём -->
    <path d="M 5.6,19.8 L 24.4,15.6 L 24.4,11.0 L 32.8,9.1 L 41.2,11.0 L 41.2,15.6 L 60,19.8 V 24.2 H 5.6 Z"
          fill="#fff" stroke-width="0.37"/>
    <!-- Пунктир: продолжение основного ската под фонарём -->
    <path d="M 24.4,15.6 L 32.8,13.72 L 41.2,15.6" stroke-width="0.34" stroke-dasharray="2.25 1.3"/>
    <!-- Серый клин между скатом и горизонталью -->
    <path d="M 5.6,19.8 L 18.5,16.92 V 19.8 Z" fill="#c8c8c8" stroke="none"/>
    <!-- Горизонтальный луч угла α -->
    <path d="M 5.6,19.8 H 24" stroke-width="0.23"/>
    <!-- Размерная дуга угла α (центр в левой точке карниза) -->
    <path d="M 18.77,16.86 A 13.5,13.5 0 0 1 19.1,19.8" stroke-width="0.23"/>

    <!-- a: ширина фонаря, размерная линия над фонарём -->
    <path d="M 24.4,10.5 V 5.35 M 41.2,10.5 V 5.35" stroke-width="0.18"/>
    <path d="M 24.4,6.55 H 41.2" stroke-width="0.24"/>

    <!-- hf: высота стенки фонаря от основного ската до карниза фонаря -->
    <path d="M 24.4,11.0 H 19.1 M 24.4,15.6 H 19.1" stroke-width="0.18"/>
    <path d="M 20.1,11.0 V 15.6" stroke-width="0.24"/>

    <!-- h: подъём основной двускатной кровли -->
    <path d="M 32.8,13.72 H 65.5 M 60,19.8 H 65.5" stroke-width="0.18"/>
    <path d="M 63.1,13.72 V 19.8" stroke-width="0.24"/>

    <!-- H: высота от основания до конька фонаря -->
    <path d="M 32.8,9.1 H 71.3 M 60,24.2 H 71.3" stroke-width="0.18"/>
    <path d="M 69.5,9.1 V 24.2" stroke-width="0.24"/>

    <!-- L: ширина здания, текст над размерной линией -->
    <path d="M 5.6,24.65 V 29.1 M 60,24.65 V 29.1" stroke-width="0.18"/>
    <path d="M 5.6,28.1 H 60" stroke-width="0.24"/>
  </g>
  <g fill="#111" stroke="none">
    <!-- a -->
    <path d="M 24.4,6.55 L 26.55,5.99 V 7.11 Z"/>
    <path d="M 41.2,6.55 L 39.05,5.99 V 7.11 Z"/>
    <!-- hf: уменьшенная длина, но широкие читаемые стрелки при коротком размере -->
    <path d="M 20.1,11.0 L 19.57,12.65 H 20.63 Z"/>
    <path d="M 20.1,15.6 L 19.57,13.95 H 20.63 Z"/>
    <!-- h -->
    <path d="M 63.1,13.72 L 62.55,15.65 H 63.65 Z"/>
    <path d="M 63.1,19.8 L 62.55,17.87 H 63.65 Z"/>
    <!-- H -->
    <path d="M 69.5,9.1 L 68.95,11.25 H 70.05 Z"/>
    <path d="M 69.5,24.2 L 68.95,22.05 H 70.05 Z"/>
    <!-- L -->
    <path d="M 5.6,28.1 L 7.75,27.54 V 28.66 Z"/>
    <path d="M 60,28.1 L 57.85,27.54 V 28.66 Z"/>
    <!-- α: наконечники у двух границ угла -->
    <path d="M 18.77,16.86 L 17.89,15.14 L 18.98,14.94 Z"/>
    <path d="M 19.1,19.8 L 19.65,21.75 H 18.55 Z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="3.5278" font-weight="normal" fill="#111">
    <text x="32.8" y="5.0" text-anchor="middle">a</text>
    <text x="13.7" y="14.6">h<tspan font-size="2.45" baseline-shift="sub">f</tspan></text>
    <text x="64.4" y="18.1">h</text>
    <text x="71.7" y="18.15">H</text>
    <text x="32.8" y="27.4" text-anchor="middle">L</text>
    <text x="22.0" y="23.25">α</text>
  </g>
</svg>
