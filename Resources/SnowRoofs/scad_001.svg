<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="78mm" height="30mm" viewBox="0 0 78 30">
  <title>Односкатная кровля: угол α, размеры h, H, L</title>
  <desc>Схема односкатной кровли: L, H, h и угловой размер α с дуговой размерной линией и встречными стрелками. Физический размер 78 x 30 мм, шрифт 10 pt.</desc>
  <g fill="none" stroke="#111" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Основной контур сечения -->
    <path d="M 5.6,13.45 L 60.0,4.95 V 21.65 H 5.6 Z"
          fill="#fff" stroke-width="0.37"/>
    <!-- Угловой клин у ската -->
    <path d="M 5.6,13.45 L 25.8,10.295 V 13.45 Z"
          fill="#c8c8c8" stroke="none"/>
    <path d="M 5.6,13.45 H 28.0" stroke-width="0.23"/>
    <path d="M 5.6,13.45 L 60.0,4.95" stroke-width="0.37"/>

    <!-- Угловой размер α по ГОСТ 2.307-2011, п. 5.3:
         размерная линия - дуга окружности с центром в вершине угла;
         верхняя и нижняя стрелки направлены навстречу друг другу по дуге. -->
    <path d="M 25.068,8.062 A 20.2,20.2 0 0 1 25.588,16.369"
          stroke-width="0.23" stroke-linecap="round"/>

    <!-- Выносные линии h: от нижней отметки ската до отметки верхнего правого угла -->
    <path d="M 39.2,4.95 H 62.0 M 28.0,13.45 H 43.1"
          stroke-width="0.18"/>
    <path d="M 39.2,4.95 V 13.45" stroke-width="0.24"/>

    <!-- Выносные линии H -->
    <path d="M 60.0,4.95 H 65.0 M 60.0,21.65 H 65.0"
          stroke-width="0.18"/>
    <path d="M 65.0,4.95 V 21.65" stroke-width="0.24"/>

    <!-- Размер L: подпись располагается НАД непрерывной размерной линией -->
    <path d="M 5.6,22.15 V 28.85 M 60.0,22.15 V 28.85"
          stroke-width="0.18"/>
    <path d="M 5.6,27.65 H 60.0" stroke-width="0.24"/>
  </g>

  <!-- Увеличенные заполненные размерные стрелки (при физической высоте рисунка 30 мм) -->
  <g fill="#111" stroke="none">
    <!-- h -->
    <path d="M 39.2,4.95 L 38.67,6.90 L 39.73,6.90 Z"/>
    <path d="M 39.2,13.45 L 38.67,11.50 L 39.73,11.50 Z"/>
    <!-- H -->
    <path d="M 65.0,4.95 L 64.45,7.10 L 65.55,7.10 Z"/>
    <path d="M 65.0,21.65 L 64.45,19.50 L 65.55,19.50 Z"/>
    <!-- L -->
    <path d="M 5.6,27.65 L 7.75,27.09 L 7.75,28.21 Z"/>
    <path d="M 60.0,27.65 L 57.85,27.09 L 57.85,28.21 Z"/>
    <!-- α: наконечники у пересечения дуги со скатом и горизонталью;
         стрелки направлены внутрь угла (навстречу друг другу). -->
    <path d="M 25.558,10.332 L 24.729,8.589 L 25.816,8.419 Z"/>
    <path d="M 25.800,13.450 L 26.350,15.300 L 25.250,15.300 Z"/>
  </g>

  <!-- 10 pt = 3.5278 мм при 100% вставке в Word; без масштабирования по высоте -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="3.5278" font-weight="normal"
     fill="#111">
    <text x="33.1" y="7.9">h</text>
    <text x="67.2" y="14.55">H</text>
    <text x="32.80" y="26.05" text-anchor="middle">L</text>
    <text x="28.1" y="18.35">α</text>
  </g>
</svg>
