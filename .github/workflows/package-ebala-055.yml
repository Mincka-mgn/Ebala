name: Prepare Ebala 0.55 beta archives

on:
  push:
    branches: [main]
    paths:
      - 'Ebala_0.55.zip'
      - '.github/workflows/package-ebala-055.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify Windows executable and package resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package Windows and full sources
        run: python3 .github/scripts/package_ebala_beta.py 0.55
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ebala_0.55_Windows_beta
          path: dist/Ebala_0.55.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload complete sources
        uses: actions/upload-artifact@v4
        with:
          name: Ebala_0.55_Sources_beta
          path: dist/Ebala_0.55_Sources.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
